              break
            fi
            git commit -m "collected: sector_etfs $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Analyze (depends on all collectors) ─────────────────────
  analyze:
    needs:
      - universe
      - collect-prices
      - collect-fundamentals
      - collect-news
      - collect-analyst
      - collect-macro
      - collect-sector-etfs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run analysis
        run: |
          source .venv/bin/activate
          python -m engine.analyze

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git add -f frontend/public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d) rankings"
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy ──────────────────────────────────────────────────
  deploy:
    needs: analyze
    if: needs.analyze.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
