              break
            fi
            git commit -m "collected: news $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  collect-analyst:
    needs: universe
    if: needs.universe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Collect analyst data
        run: |
          source .venv/bin/activate
          RUN_DATE="${{ needs.universe.outputs.run_date }}"
          python -m engine.collect analyst --date "$RUN_DATE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
