      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ needs.universe.outputs.run_date }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f "collected/$RUN_DATE/fundamentals.json"
            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "collected: fundamentals $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  collect-news:
    needs: universe
    if: needs.universe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
