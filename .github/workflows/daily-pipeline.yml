name: Daily Data Pipeline

on:
  schedule:
    # Run at UTC 22:00 Mon-Fri (after US market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers for testing (leave empty for full universe)'
        required: false
        default: ''
      force:
        description: 'Force full run even on non-trading days'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  # ── Build universe & check trading day ──────────────────────
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      run_date: ${{ steps.date.outputs.run_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run date
        id: date
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Run date: $RUN_DATE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Check trading day
        id: check
        run: |
          source .venv/bin/activate
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python -c "
          from engine.utils.market_calendar import is_us_trading_day
          import sys
          if not is_us_trading_day():
              print('US market is closed today — skipping pipeline')
              sys.exit(1)
          " && echo "skip=false" >> "$GITHUB_OUTPUT" || echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universe
        if: steps.check.outputs.skip != 'true'
        run: |
          source .venv/bin/activate
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python -m engine.collect universe --tickers $TICKERS --date "$RUN_DATE"
          else
            python -m engine.collect universe --date "$RUN_DATE"
          fi

      - name: Commit and push universe
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f "collected/$RUN_DATE/universe.json"
            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "collected: universe $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Parallel collectors (depend on universe) ────────────────
  collect-prices:
    needs: universe
    if: needs.universe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Collect prices
        run: |
          source .venv/bin/activate
          RUN_DATE="${{ needs.universe.outputs.run_date }}"
          python -m engine.collect prices --date "$RUN_DATE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ needs.universe.outputs.run_date }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f "collected/$RUN_DATE/prices.json"
            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "collected: prices $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  collect-fundamentals:
