              break
            fi
            git commit -m "collected: analyst $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Independent collectors (no universe dependency) ─────────
  collect-macro:
    needs: universe
    if: needs.universe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
