name: Daily Data Pipeline

on:
  schedule:
    # Run at UTC 22:00 Mon-Fri (after US market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers for testing (leave empty for full universe)'
        required: false
        default: ''
      force:
        description: 'Force full run even on non-trading days'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ATHENE_FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            # Convert comma-separated to space-separated for CLI args
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python -m engine.main $TICKERS
          else
            python -m engine.main
          fi

      - name: Check for rating changes
        id: check_changes
        run: |
          if [ -f frontend/public/data/feed.xml ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d) rankings"
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

  deploy:
    needs: pipeline
    if: needs.pipeline.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
