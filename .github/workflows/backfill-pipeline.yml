name: Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), e.g. 2024-01-01'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD), e.g. 2024-12-31'
        required: false
        default: ''
      skip_snapshot:
        description: 'Skip today snapshot collection (fundamentals/news/analyst/macro)'
        required: false
        type: boolean
        default: false
      skip_analyze:
        description: 'Skip analyze + deploy (useful for incremental backfill)'
        required: false
        type: boolean
        default: false
      force_collect:
        description: 'Force re-fetch collected data even if it already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  # ── Setup: universe + cleanup ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_date: ${{ steps.date.outputs.run_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run date
        id: date
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Run date: $RUN_DATE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Build universe
        run: |
          source .venv/bin/activate
          python -m engine.collect universe --date "${{ steps.date.outputs.run_date }}"

      - name: Remove old flat collected files
        run: rm -f collected/*.json collected/*.json.gz

      - name: Commit setup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          git add -f "collected/${RUN_DATE:0:4}/${RUN_DATE:5:2}/${RUN_DATE:8:2}/"
          git add -u collected/
          if git diff --staged --quiet; then
            echo "No setup changes to commit"
          else
            git commit -m "backfill: setup $RUN_DATE [skip ci]"
            git push origin main
          fi

  # ── Backfill: prices ───────────────────────────────────────
  backfill-prices:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill prices
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect prices $ARGS

      - name: Commit prices data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: prices"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/prices/
            if git diff --staged --quiet; then
              echo "No prices changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Backfill: sector ETFs ──────────────────────────────────
  backfill-sector-etfs:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill sector ETFs
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect sector_etfs $ARGS

      - name: Commit sector ETFs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: sector_etfs"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/sector_etfs/
            if git diff --staged --quiet; then
              echo "No sector ETFs changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Backfill: capital flow ETFs ────────────────────────────
  backfill-capital-flow-etfs:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill capital flow ETFs
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect capital_flow_etfs $ARGS

      - name: Backfill shares outstanding
        run: |
          source .venv/bin/activate
          python -m engine.collect capital_flow_etfs --backfill-shares

      - name: Commit capital flow ETFs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: capital_flow_etfs"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/capital_flow_etfs/
            if git diff --staged --quiet; then
              echo "No capital flow ETFs changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Snapshot: today's fundamentals/news/analyst/macro ──────
  snapshot:
    needs: setup
    if: inputs.skip_snapshot != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Collect snapshots (parallel)
        run: |
          source .venv/bin/activate
          RUN_DATE="${{ needs.setup.outputs.run_date }}"
          FORCE_FLAG=""
          [ "${{ inputs.force_collect }}" = "true" ] && FORCE_FLAG="--force"

          python -m engine.collect fundamentals --date "$RUN_DATE" $FORCE_FLAG &
          PID_FUND=$!
          python -m engine.collect news --date "$RUN_DATE" $FORCE_FLAG &
          PID_NEWS=$!
          python -m engine.collect analyst --date "$RUN_DATE" $FORCE_FLAG &
          PID_ANALYST=$!
          python -m engine.collect macro --date "$RUN_DATE" $FORCE_FLAG &
          PID_MACRO=$!

          FAIL=0
          wait $PID_FUND    || FAIL=1
          wait $PID_NEWS    || FAIL=1
          wait $PID_ANALYST || FAIL=1
          wait $PID_MACRO   || FAIL=1
          [ $FAIL -eq 0 ] || exit 1

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ needs.setup.outputs.run_date }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            DATE_DIR="collected/${RUN_DATE:0:4}/${RUN_DATE:5:2}/${RUN_DATE:8:2}"
            git add -f "$DATE_DIR/fundamentals.json" "$DATE_DIR/news.json" "$DATE_DIR/analyst.json" "$DATE_DIR/macro.json"
            if git diff --staged --quiet; then
              echo "No snapshot changes"
              break
            fi
            git commit -m "backfill: snapshots $RUN_DATE [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Analyze + export ───────────────────────────────────────
  analyze:
    needs: [backfill-prices, backfill-sector-etfs, backfill-capital-flow-etfs, snapshot]
    if: ${{ !failure() && !cancelled() && inputs.skip_analyze != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          test -d .venv || python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run analysis
        run: |
          source .venv/bin/activate
          python -m engine.analyze

      - name: Commit analysis data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA_CHANGED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f frontend/public/data/
            [ -d snapshots ] && git add -f snapshots/
            if git diff --staged --quiet; then
              echo "No analysis data changes"
              break
            fi
            git commit -m "data: update $(date -u +%Y-%m-%d) rankings"
            if git push origin main; then
              DATA_CHANGED=true
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "data_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"

  # ── Deploy ─────────────────────────────────────────────────
  deploy:
    needs: analyze
    if: ${{ !failure() && !cancelled() && needs.analyze.outputs.data_changed == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
