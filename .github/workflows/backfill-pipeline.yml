name: Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), e.g. 2024-01-01'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD), e.g. 2024-12-31'
        required: false
        default: ''
      skip_snapshot:
        description: 'Skip today snapshot collection (fundamentals/news/analyst/macro)'
        required: false
        type: boolean
        default: false
      skip_analyze:
        description: 'Skip analyze + deploy (useful for incremental backfill)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has_analysis: ${{ steps.analyze-commit.outputs.data_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run date
        id: date
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Run date: $RUN_DATE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build universe
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          python -m engine.collect universe --date "$RUN_DATE"

      - name: Remove old flat collected files
        run: rm -f collected/*.json collected/*.json.gz

      - name: Backfill prices, sector ETFs, capital flow ETFs (parallel)
        run: |
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"

          python -m engine.collect prices $ARGS &
          PID_PRICES=$!
          python -m engine.collect sector_etfs $ARGS &
          PID_SECTOR=$!
          python -m engine.collect capital_flow_etfs $ARGS &
          PID_CAPITAL=$!

          FAIL=0
          wait $PID_PRICES  || FAIL=1
          wait $PID_SECTOR  || FAIL=1
          wait $PID_CAPITAL || FAIL=1
          [ $FAIL -eq 0 ] || exit 1

      - name: Collect today snapshots (parallel)
        if: inputs.skip_snapshot != true
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"

          python -m engine.collect fundamentals --date "$RUN_DATE" &
          PID_FUND=$!
          python -m engine.collect news --date "$RUN_DATE" &
          PID_NEWS=$!
          python -m engine.collect analyst --date "$RUN_DATE" &
          PID_ANALYST=$!
          python -m engine.collect macro --date "$RUN_DATE" &
          PID_MACRO=$!

          FAIL=0
          wait $PID_FUND    || FAIL=1
          wait $PID_NEWS    || FAIL=1
          wait $PID_ANALYST || FAIL=1
          wait $PID_MACRO   || FAIL=1
          [ $FAIL -eq 0 ] || exit 1

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: collected data"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/
            if git diff --staged --quiet; then
              echo "No collected data changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

      - name: Run analysis
        if: inputs.skip_analyze != true
        run: python -m engine.analyze

      - name: Commit analysis data
        if: inputs.skip_analyze != true
        id: analyze-commit
        run: |
          DATA_CHANGED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f frontend/public/data/
            if git diff --staged --quiet; then
              echo "No analysis data changes"
              break
            fi
            git commit -m "data: update $(date -u +%Y-%m-%d) rankings"
            if git push origin main; then
              DATA_CHANGED=true
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "data_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"

  deploy:
    needs: backfill
    if: needs.backfill.outputs.has_analysis == 'true'
    uses: ./.github/workflows/deploy-pages.yml
