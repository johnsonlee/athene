name: Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), e.g. 2024-01-01'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYY-MM-DD), e.g. 2024-12-31'
        required: false
        default: ''
      skip_snapshot:
        description: 'No-op (backfill no longer collects snapshots, daily pipeline handles it)'
        required: false
        type: boolean
        default: false
      skip_analyze:
        description: 'Skip analyze + deploy (equivalent to trigger_daily=false)'
        required: false
        type: boolean
        default: false
      force_collect:
        description: 'Force re-fetch collected data even if it already exists'
        required: false
        type: boolean
        default: false
      trigger_daily:
        description: 'Trigger daily pipeline after backfill completes'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  # ── Setup: universe + cleanup ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_date: ${{ steps.date.outputs.run_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run date
        id: date
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Run date: $RUN_DATE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if [ ! -d .venv ] || ! .venv/bin/python -c 'import sys' 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Build universe
        run: |
          source .venv/bin/activate
          python -m engine.collect universe --date "${{ steps.date.outputs.run_date }}"

      - name: Remove old flat collected files
        run: rm -f collected/*.json collected/*.json.gz

      - name: Commit setup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          git add -f "collected/${RUN_DATE:0:4}/${RUN_DATE:5:2}/${RUN_DATE:8:2}/"
          git add -u collected/
          if git diff --staged --quiet; then
            echo "No setup changes to commit"
          else
            git commit -m "backfill: setup $RUN_DATE [skip ci]"
            git push origin main
          fi

  # ── Backfill: prices ───────────────────────────────────────
  backfill-prices:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if [ ! -d .venv ] || ! .venv/bin/python -c 'import sys' 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill prices
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect prices $ARGS

      - name: Commit prices data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: prices"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/prices/
            if git diff --staged --quiet; then
              echo "No prices changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Backfill: sector ETFs ──────────────────────────────────
  backfill-sector-etfs:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if [ ! -d .venv ] || ! .venv/bin/python -c 'import sys' 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill sector ETFs
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect sector_etfs $ARGS

      - name: Commit sector ETFs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: sector_etfs"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/sector_etfs/
            if git diff --staged --quiet; then
              echo "No sector ETFs changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Backfill: capital flow ETFs ────────────────────────────
  backfill-capital-flow-etfs:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if [ ! -d .venv ] || ! .venv/bin/python -c 'import sys' 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Backfill capital flow ETFs
        run: |
          source .venv/bin/activate
          ARGS="--backfill"
          [ -n "${{ inputs.start_date }}" ] && ARGS="$ARGS --start ${{ inputs.start_date }}"
          [ -n "${{ inputs.end_date }}" ]   && ARGS="$ARGS --end ${{ inputs.end_date }}"
          [ "${{ inputs.force_collect }}" = "true" ] && ARGS="$ARGS --force"
          python -m engine.collect capital_flow_etfs $ARGS

      - name: Backfill shares outstanding
        run: |
          source .venv/bin/activate
          python -m engine.collect capital_flow_etfs --backfill-shares

      - name: Commit capital flow ETFs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LABEL="backfill: capital_flow_etfs"
          [ -n "${{ inputs.start_date }}" ] && LABEL="$LABEL (${{ inputs.start_date }} to ${{ inputs.end_date }})"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset origin/main
            git add -f collected/*/*/*/capital_flow_etfs/
            if git diff --staged --quiet; then
              echo "No capital flow ETFs changes"
              break
            fi
            git commit -m "$LABEL [skip ci]"
            git push origin main && break
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

  # ── Trigger daily pipeline for collect + analyze + deploy ──
  trigger-daily:
    needs: [backfill-prices, backfill-sector-etfs, backfill-capital-flow-etfs]
    if: ${{ !failure() && !cancelled() && inputs.trigger_daily != false && inputs.skip_analyze != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily pipeline
        run: gh workflow run daily-pipeline.yml --repo "${{ github.repository }}" -f force=true
        env:
          GH_TOKEN: ${{ github.token }}
